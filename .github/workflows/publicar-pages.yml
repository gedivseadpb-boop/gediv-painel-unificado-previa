name: Publicar prévia estática GEDIV no GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validar-e-preparar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validar artefato público (somente dados sintéticos autorizados)
        run: python scripts/validar_artefato_publico.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar artefato estático (public/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: validar-e-preparar
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
